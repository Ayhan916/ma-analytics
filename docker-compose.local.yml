services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ma_analytics
      POSTGRES_USER: ma_analytics
      POSTGRES_PASSWORD: ma_analytics
    ports:
      - "5434:5432"
    volumes:
      - ma_analytics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ma_analytics -d ma_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://ma_analytics:ma_analytics@db:5432/ma_analytics
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://ma_analytics:ma_analytics@db:5432/ma_analytics
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.pipeline.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://ma_analytics:ma_analytics@db:5432/ma_analytics
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.pipeline.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend

volumes:
  ma_analytics_pgdata:
